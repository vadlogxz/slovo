<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round">
  <!-- low, compact glow rays hugging the horizon -->
  <line x1="50" y1="38" x2="50" y2="46"/>
  <line x1="30" y1="42" x2="35.5" y2="46.5"/>
  <line x1="70" y1="42" x2="64.5" y2="46.5"/>
  <line x1="14" y1="53" x2="24" y2="53"/>
  <line x1="86" y1="53" x2="76" y2="53"/>

  <!-- sun, mostly sunk below the horizon (shallow cap) -->
  <path d="M 33 58 A 18 10 0 0 1 67 58"/>

  <!-- horizon line, broken where the sun sits -->
  <line x1="8" y1="58" x2="33" y2="58"/>
  <line x1="67" y1="58" x2="92" y2="58"/>

  <!-- reflection waves: single centered lines, narrowing -->
  <line x1="24.5" y1="70" x2="75.5" y2="70"/>
  <line x1="41.5" y1="82" x2="58.5" y2="82"/>
</svg>
